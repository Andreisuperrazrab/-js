<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Реєстрація — Bounty Hunter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/pages.css">
</head>
<body class="">
<header class="site-header site-header--center"><a class="logo" href="index.html" aria-label="Bounty Hunter"><img src="assets/logo.svg" alt="Bounty Hunter"></a></header>
<main>
  <section class="auth" aria-labelledby="t">
    <h1 id="t">реєстрація</h1>
    <form id="register-form" action="home.html" novalidate>
      <div class="field"><label for="r-login">логін</label><input class="input" id="r-login" type="text" placeholder="придумайте логін" required></div>
      <div class="field"><label for="r-email">Email</label><input class="input" id="r-email" type="email" placeholder="name@example.com" required></div>
      <div class="field"><label for="r-pass">Пароль</label><input class="input" id="r-pass" type="password" placeholder="мінімум 8 символів" minlength="8" required></div>
      <div class="field"><label for="r-role">Я —</label>
        <select class="select" id="r-role"><option value="freelancer">Фрілансер</option><option value="client">Замовник</option></select></div>
      <p class="form-error" id="register-error" role="alert"></p>
      <button class="btn" type="submit">Зареєструватися</button>
    </form>
    <p class="alt">Вже є акаунт? <a href="index.html">Увійти</a></p>
  </section>
</main>
<footer class="site-footer">
  <a href="help.html">виникли проблеми ?</a>
  <a href="about.html">Про сайт</a>
  <div class="social"><a href="https://facebook.com" aria-label="Facebook"><img src="assets/facebook.svg" alt="Facebook"></a><a href="https://instagram.com" aria-label="Instagram"><img src="assets/instagram.svg" alt="Instagram"></a></div>
</footer>
<script src="js/main.js"></script>
</body>
</html>
